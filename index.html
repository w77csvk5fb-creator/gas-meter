<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ガソリン代">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>ガソリン代メーター</title>
</head>
<body>
  <header class="topbar">
    <h1>ガソリン代メーター</h1>
    <span id="carLabel" class="car-label"></span>
  </header>

  <div id="installBanner" class="banner" hidden>
    <div>
      <strong>ホーム画面に追加するとアプリとして使えます</strong>
      <p>Safari の共有ボタン <span class="share-icon" aria-hidden="true">⬆︎</span> →「ホーム画面に追加」</p>
    </div>
    <button id="bannerClose" class="icon-btn" aria-label="閉じる">×</button>
  </div>

  <main>
    <!-- 計算 -->
    <section id="view-calc" class="view active" aria-label="計算">
      <form id="calcForm" class="card calc" autocomplete="off">
        <label class="dist-field">
          <span class="field-label">走行距離</span>
          <span class="dist-input">
            <input id="distKm" type="number" inputmode="decimal" min="0" step="0.1" placeholder="0.0" aria-label="走行距離（km）">
            <span>km</span>
          </span>
        </label>
        <div class="meter-cost" aria-live="polite">
          <span class="yen">¥</span><span id="liveCost">0</span>
        </div>
        <div class="meter-sub">消費するガソリン <span id="liveL">0.00</span> L</div>
        <div class="quick">
          <div class="quick-item">
            <span class="stat-label">ガソリン単価</span>
            <div class="stepper">
              <button class="step" type="button" data-key="pricePerL" data-step="-1" aria-label="単価を1円下げる">−</button>
              <input id="qPrice" class="step-input" type="number" inputmode="decimal" min="1" step="1" aria-label="ガソリン単価（円/L）">
              <button class="step" type="button" data-key="pricePerL" data-step="1" aria-label="単価を1円上げる">＋</button>
            </div>
            <span class="quick-unit">円/L</span>
          </div>
          <div class="quick-item">
            <span class="stat-label">燃費</span>
            <div class="stepper">
              <button class="step" type="button" data-key="kmPerL" data-step="-0.1" aria-label="燃費を0.1下げる">−</button>
              <input id="qKmPerL" class="step-input" type="number" inputmode="decimal" min="0.1" step="0.1" aria-label="燃費（km/L）">
              <button class="step" type="button" data-key="kmPerL" data-step="0.1" aria-label="燃費を0.1上げる">＋</button>
            </div>
            <span class="quick-unit">km/L</span>
          </div>
        </div>
        <div class="price-check">
          <span id="priceUpdated" class="price-updated"></span>
          <a id="gogoLink" class="gogo-link" href="https://gogo.gs/map" target="_blank" rel="noopener">gogo.gsで価格を見る<span aria-hidden="true"> ↗</span></a>
        </div>
      </form>

      <button id="recordBtn" class="record-btn" type="submit" form="calcForm" disabled>記録する</button>
      <p class="hint center">トリップメーターの数字などを入れて「記録する」を押すと、履歴に残ります</p>
    </section>

    <!-- 履歴 -->
    <section id="view-history" class="view" aria-label="履歴">
      <div class="card summary">
        <h2 id="summaryTitle">今月</h2>
        <div class="summary-grid">
          <div><span class="stat-label">ガソリン代</span><span id="sumCost" class="sum-val">¥0</span></div>
          <div><span class="stat-label">消費</span><span id="sumL" class="sum-val">0.00 L</span></div>
          <div><span class="stat-label">距離</span><span id="sumKm" class="sum-val">0.0 km</span></div>
          <div><span class="stat-label">回数</span><span id="sumCount" class="sum-val">0 回</span></div>
        </div>
      </div>
      <ul id="historyList" class="history"></ul>
      <p id="historyEmpty" class="empty">まだ記録がありません</p>
    </section>

    <!-- 設定 -->
    <section id="view-settings" class="view" aria-label="設定">
      <div class="card form">
        <label class="field">
          <span class="field-label">車の名前（任意）</span>
          <input id="setCar" type="text" placeholder="例: プリウス" autocomplete="off">
        </label>
        <label class="field">
          <span class="field-label">燃費</span>
          <span class="input-unit"><input id="setKmPerL" type="number" inputmode="decimal" min="0.1" step="0.1"><span>km/L</span></span>
          <small>実燃費がわからなければ、カタログ燃費（WLTC）の8割くらいが目安です</small>
        </label>
        <label class="field">
          <span class="field-label">ガソリン単価</span>
          <span class="input-unit"><input id="setPrice" type="number" inputmode="decimal" min="1" step="1"><span>円/L</span></span>
          <small>計算画面の −／＋ でも変えられます</small>
        </label>
        <label class="field">
          <span class="field-label">単価の確認先（gogo.gs）</span>
          <select id="setPriceArea">
            <option value="">現在地の周辺（地図）</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label">いつものスタンドのページ（任意）</span>
          <input id="setPriceUrl" type="url" inputmode="url" placeholder="https://gogo.gs/shop/…" autocomplete="off">
          <small>gogo.gsでスタンドのページを開き、アドレスをコピーして貼り付けると、そのページを直接開きます</small>
        </label>
      </div>

      <div class="card">
        <h2>データ</h2>
        <p class="hint">記録はこのiPhoneの中だけに保存されます</p>
        <button id="clearBtn" class="btn btn-danger" type="button">履歴をすべて削除</button>
      </div>
    </section>
  </main>

  <nav class="tabbar" aria-label="メニュー">
    <button class="tab active" data-view="calc" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M8 7h8M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01"/></svg>
      <span>計算</span>
    </button>
    <button class="tab" data-view="history" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      <span>履歴</span>
    </button>
    <button class="tab" data-view="settings" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      <span>設定</span>
    </button>
  </nav>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
